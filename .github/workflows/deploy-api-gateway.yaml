name: Deploy API Gateway

on:
  push:
    branches:
      - main
    paths:
      - 'api-gateway/**'
      - '.github/workflows/deploy-api-gateway.yaml'

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: distributed-lovable/api-gateway
  EKS_CLUSTER: distributed-lovable-dev-eks
  NAMESPACE: lovable-core
  SERVICE_NAME: api-gateway

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./api-gateway
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::164429444725:role/distributed-lovable-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        working-directory: ./api-gateway
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .
          
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/$SERVICE_NAME \
            $SERVICE_NAME=${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }} \
            -n $NAMESPACE

      - name: Wait for Rollout
        run: |
          kubectl rollout status \
            deployment/$SERVICE_NAME \
            -n $NAMESPACE \
            --timeout=5m

      - name: Verify Deployment
        run: |
          kubectl get deployment $SERVICE_NAME -n $NAMESPACE
          kubectl get pods -n $NAMESPACE -l app=$SERVICE_NAME

      - name: Health Check
        run: |
          kubectl run ci-health-check \
            -n $NAMESPACE \
            --rm \
            -i \
            --restart=Never \
            --image=curlimages/curl \
            -- \
            curl -fsS http://$SERVICE_NAME:80/actuator/health
