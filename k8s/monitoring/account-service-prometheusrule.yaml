apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: account-service-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: account-service
      rules:

        - alert: AccountServiceDown
          expr: absent(up{service="account-service"}) or min(up{service="account-service"}) == 0
          for: 2m
          labels:
            severity: critical
            service: account-service
          annotations:
            summary: "Account Service is down"
            description: "Account Service has been unavailable for more than 2 minutes."

        - alert: AccountServiceHighErrorRate
          expr: |
            100 *
            sum(rate(http_server_requests_seconds_count{
              service="account-service",
              uri!~"/actuator/.*",
              status=~"5.."
            }[5m]))
            /
            sum(rate(http_server_requests_seconds_count{
              service="account-service",
              uri!~"/actuator/.*"
            }[5m]))
            > 5
          for: 5m
          labels:
            severity: warning
            service: account-service
          annotations:
            summary: "Account Service error rate is high"
            description: "Account Service 5xx error rate has exceeded 5% for more than 5 minutes."
